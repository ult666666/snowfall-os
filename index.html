<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#324b65">
  <meta name="description" content="An alpine winter wallpaper for Mac. Watch the snow fall, build a snowman, and send a little plow through fresh powder.">
  <title>Snowfall · Frostpine Hollow</title>
  <link rel="icon" href="assets/cabin-icon.png?v=3">
  <link rel="preload" as="image" href="assets/scene.jpg?v=3">
  <link rel="stylesheet" href="desktop.css?v=3">
  <link rel="stylesheet" href="apps.css?v=3">
  <link rel="stylesheet" href="radio.css?v=3">
  <link rel="stylesheet" href="yard.css?v=3">
  <script defer src="apps.js?v=3"></script>
  <script defer src="radio.js?v=3"></script>
  <script defer src="yard.js?v=3"></script>
  <link rel="stylesheet" href="rooms.css?v=3">
  <script defer src="rooms.js?v=3"></script>
  <script defer src="widget-eaves.js?v=3"></script>
  <script defer src="desktop.js?v=3"></script>
</head>
<body>
  <main id="scene" aria-label="Frostpine Hollow winter landscape">
    <img id="wallpaper" src="assets/scene.jpg?v=3" draggable="false" alt="A painted winter village with snow-capped cottages, a little bakery, and a fox beside a wooden bridge.">
    <div id="snow" aria-hidden="true"></div>
    <canvas id="widget-eaves" aria-hidden="true" width="1" height="1"></canvas>
    <div id="demo-village" aria-label="Sample folder cottages">
      <button type="button" class="village-house sketchbook" data-sample="sample-sketchbook" aria-label="Open the Sketchbook house"><img src="assets/houses/cottage-1.png" alt=""><span>Sketchbook</span></button>
      <button type="button" class="village-house studio" data-sample="sample-studio" aria-label="Open the Studio house"><img src="assets/houses/cottage-3.png" alt=""><span>Studio</span></button>
      <button type="button" class="village-house library" data-sample="sample-library" aria-label="Open the Library house"><img src="assets/houses/cottage-5.png" alt=""><span>Library</span></button>
      <button type="button" id="village-clock" title="Switch clock format" aria-label="Switch clock format"><span id="village-day"></span><time id="village-time"></time></button>
    </div>
    <div id="yard-stage" aria-label="Snow yard"></div>
    <div id="surface-controls">
      <div class="scene-caption">Frostpine Hollow</div>
      <nav class="scene-controls glass" aria-label="Wallpaper controls">
        <button id="houses" type="button" aria-expanded="false" aria-controls="tools-panel"><span data-icon="houses"></span>Houses</button>
        <i aria-hidden="true"></i>
        <button id="play" type="button"><span data-icon="snow"></span>Play in snow</button>
        <i aria-hidden="true"></i>
        <button id="tools" type="button" aria-expanded="false" aria-controls="tools-panel"><span data-icon="sliders"></span>Tools</button>
        <i aria-hidden="true"></i>
        <button id="fullscreen" type="button" class="icon-control" aria-label="Enter full screen" title="Enter full screen"><span data-icon="expand"></span></button>
      </nav>
    </div>
    <button id="back-to-desk" type="button" class="glass done" hidden><span data-icon="check"></span>Done</button>
    <section id="tools-panel" class="glass" aria-labelledby="panel-title" hidden>
      <header class="panel-head">
        <button id="panel-back" type="button" class="icon-control" aria-label="Back to cabin tools" hidden><span data-icon="back"></span></button>
        <h1 id="panel-title">Cabin tools</h1>
        <button id="panel-close" type="button" class="icon-control" aria-label="Close cabin tools"><span data-icon="close"></span></button>
      </header>
      <div id="panel-body"></div>
    </section>
    <p class="sr-only" role="status" id="status"></p>
  </main>
</body>
</html>
