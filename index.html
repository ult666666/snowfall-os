<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#324b65">
  <meta name="description" content="An alpine winter wallpaper for Mac. Watch the snow fall, build a snowman, and send a little plow through fresh powder.">
  <title>Snowfall · Frostpine Hollow</title>
  <link rel="icon" href="assets/cabin-icon.png?v=6.0.0">
  <link rel="preload" as="image" href="assets/scene.jpg?v=6.0.0">
  <link rel="stylesheet" href="desktop.css?v=6.0.0">
  <link rel="stylesheet" href="apps.css?v=6.0.0">
  <link rel="stylesheet" href="radio.css?v=6.0.0">
  <link rel="stylesheet" href="yard.css?v=6.0.0">
  <script defer src="apps.js?v=6.0.0"></script>
  <script defer src="radio.js?v=6.0.0"></script>
  <script defer src="yard.js?v=6.0.0"></script>
  <link rel="stylesheet" href="rooms.css?v=6.0.0">
  <link rel="stylesheet" href="post-office.css?v=6.0.0">
  <script defer src="rooms.js?v=6.0.0"></script>
  <script defer src="porch.js?v=6.0.0"></script>
  <script defer src="widget-eaves.js?v=6.0.0"></script>
  <script defer src="post-office.js?v=6.0.0"></script>
  <script defer src="desktop.js?v=6.0.0"></script>
  <link rel="stylesheet" href="snow-playground.css?v=6.0.0">
  <script defer src="snow-playground.js?v=6.0.0"></script>
</head>
<body>
  <main id="scene" aria-label="Frostpine Hollow winter landscape">
    <img id="wallpaper" src="assets/scene.jpg?v=6.0.0" draggable="false" alt="A winter valley at sunset. A postal house and clock tower overlook four winding streets, a frozen skating pond and a fox beside the creek.">
    <div id="snow" aria-hidden="true"></div>
    <canvas id="widget-eaves" aria-hidden="true" width="1" height="1"></canvas>
    <div id="wallpaper-cottages" aria-hidden="true"></div>
    <div id="demo-village" aria-label="Village cottages">
      <button type="button" class="scenery-door" data-scenery="bakery" aria-label="Open the village post office"></button>
      <button type="button" class="scenery-door" data-scenery="lantern" aria-label="Play snowball catch at the clockmaker’s cottage"></button>
    </div>
    <button type="button" id="village-clock" aria-label="Read the town clock">
      <span class="clock-face" aria-hidden="true"><i class="hour-hand"></i><i class="minute-hand"></i></span>
      <span class="date-leaf" aria-hidden="true"><span class="leaf-month"></span><span class="leaf-date"></span></span>
      <span class="clock-almanac"><span id="village-day"></span><time id="village-time"></time></span>
    </button>
    <div id="porch-play" hidden></div>
    <div id="yard-stage" aria-label="Snow yard"></div>
    <section id="snow-playground" aria-label="Village snow playground"></section>
    <div id="surface-controls">
      <div class="scene-caption">Frostpine Hollow</div>
      <nav class="scene-controls glass" aria-label="Wallpaper controls">
        <button id="houses" type="button" aria-expanded="false" aria-controls="tools-panel"><span data-icon="houses"></span>Houses</button>
        <i aria-hidden="true"></i>
        <button id="play" type="button"><span data-icon="snow"></span>Play in snow</button>
        <i aria-hidden="true"></i>
        <button id="tools" type="button" aria-expanded="false" aria-controls="tools-panel"><span data-icon="sliders"></span>Tools</button>
        <i aria-hidden="true"></i>
        <button id="fullscreen" type="button" class="icon-control" aria-label="Enter full screen" title="Enter full screen"><span data-icon="expand"></span></button>
      </nav>
    </div>
    <button id="back-to-desk" type="button" class="glass done" hidden><span data-icon="check"></span>Done</button>
    <section id="tools-panel" class="glass" aria-labelledby="panel-title" hidden>
      <header class="panel-head">
        <button id="panel-back" type="button" class="icon-control" aria-label="Back to cabin tools" hidden><span data-icon="back"></span></button>
        <h1 id="panel-title">Cabin tools</h1>
        <button id="panel-close" type="button" class="icon-control" aria-label="Close cabin tools"><span data-icon="close"></span></button>
      </header>
      <div id="panel-body"></div>
    </section>
    <p class="sr-only" role="status" id="status"></p>
  </main>
</body>
</html>
